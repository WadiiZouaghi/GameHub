apiVersion: v1
kind: Namespace
metadata:
  name: gaming-project

---
apiVersion: v1
kind: Secret
metadata:
  name: gaming-secrets
  namespace: gaming-project
type: Opaque
stringData:
  POSTGRES_PASSWORD: "YOUR_POSTGRES_PASSWORD"
  APP_SECRET: "YOUR_APP_SECRET_KEY_HERE"
  NEWSAPI_KEY: "YOUR_NEWSAPI_KEY"
  SQUARE_APPLICATION_ID: "YOUR_SQUARE_APP_ID"
  SQUARE_ACCESS_TOKEN: "YOUR_SQUARE_ACCESS_TOKEN"
  SQUARE_LOCATION_ID: "YOUR_SQUARE_LOCATION_ID"
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gaming-config
  namespace: gaming-project
data:
  APP_ENV: "prod"
  DATABASE_URL: "postgresql://app:YOUR_POSTGRES_PASSWORD@postgres:5432/app?serverVersion=16&charset=utf8"
  SQUARE_ENVIRONMENT: "sandbox"
  DEFAULT_URI: "http://your-domain.com"
  MAILER_DSN: "null://null"
  MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: gaming-project
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: gaming-project
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gaming-project
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "app"
        - name: POSTGRES_USER
          value: "app"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gaming-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gaming-project
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-app
  namespace: gaming-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: symfony-app
  template:
    metadata:
      labels:
        app: symfony-app
    spec:
      initContainers:
      - name: migrations
        image: your-registry/gaming-project:latest
        command: ['sh', '-c', 'php bin/console doctrine:migrations:migrate --no-interaction']
        envFrom:
        - configMapRef:
            name: gaming-config
        - secretRef:
            name: gaming-secrets
      containers:
      - name: php-fpm
        image: your-registry/gaming-project:latest
        ports:
        - containerPort: 9000
        envFrom:
        - configMapRef:
            name: gaming-config
        - secretRef:
            name: gaming-secrets
        volumeMounts:
        - name: uploads
          mountPath: /var/www/html/public/uploads
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: uploads
          mountPath: /var/www/html/public/uploads
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: nginx-config
        configMap:
          name: nginx-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: gaming-project
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        
        location / {
            try_files $uri /index.php$is_args$args;
        }
        
        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }
        
        location ~ \.php$ {
            return 404;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: symfony-service
  namespace: gaming-project
spec:
  type: LoadBalancer
  selector:
    app: symfony-app
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: gaming-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
      - name: adminer
        image: adminer:latest
        ports:
        - containerPort: 8080
        env:
        - name: ADMINER_DEFAULT_SERVER
          value: "postgres"

---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: gaming-project
spec:
  type: LoadBalancer
  selector:
    app: adminer
  ports:
  - port: 8080
    targetPort: 8080
